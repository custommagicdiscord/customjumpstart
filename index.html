<style>

/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
}

/* ===== FONT ===== */
@font-face {
  font-family: "Bank Gothic";
  src: url('BankGothic Bold.ttf');
}

/* ===== BASE ===== */
body {
  font-family: "Bank Gothic";
  background-image: url('grey-blue-marble-texture 4.png');
  background-size: 100% 1000px;
  background-repeat: repeat-y;

  display: flex;
  flex-direction: column;

  height: 100vh;
  overflow: hidden;
}

/* ===== MAIN LAYOUT ===== */
.mainLayout {
  display: flex;
  width: 100%;
  align-items: flex-start;
  flex: 1;
  min-height: 0;
}

/* ===== SIDEBAR ===== */
.leftCol {
  width: 180px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
  padding-left: 0;
  margin-left: 0;
  padding-top: 120px;
}

.tab {
  background-image: url('goldbarTrim.png');
  background-size: 100% 100%;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.tab span {
  color: #755301;
  font-size: 160%;
}

/* ===== RIGHT COLUMN ===== */
.rightCol {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding-right: 10px;
}

/* ===== HEADER ===== */
.headerContainer {
  background-image: url('goldbar.png');
  background-size: 100% 100%;
  width: 75%;
  height: 60px;
  margin: 20px auto;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.headerText {
  color: #755301;
  font-size: 200%;
}

/* ===== GRID ===== */
.imageGrid {
  display: grid;
  gap: 12px;

  flex: 1;
  min-height: 0;
  padding: 10px;

  grid-template-rows: repeat(3, 1fr);

  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}

/* pack wrapper */
.pack {
  aspect-ratio: 5 / 7;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

.pack img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;

  border: 4px solid transparent;
  border-radius: 5.5%;
}

/* ===== FOOTER ===== */
.footer {
  width: 100%;
  max-width: 900px;

  height: 64px;
  flex-shrink: 0;

  margin: 0 auto;
  margin-bottom: 10px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background-image: url('goldbar.png');
  background-size: 100% 100%;

  padding: 0 12px;
  box-sizing: border-box;
}

.footerText {
  color: #755301;
  font-size: 200%;
}

.downloadBtn {
  background: none;
  border: none;
  cursor: pointer;
  margin-left: 10px;
}

.downloadBtn img {
  width: 40px;
  opacity: 0.3;
}

.randomButton {
  width: 50px;
  height: 50px;
  cursor: pointer;
  background: none;
  border: none;
}

.downloadBtn.enabled img {
  opacity: 1;
  cursor: pointer;
}

.randomButton img,
.downloadBtn img {
  width: 100%;
  border: none;
  border-radius: 0;
  background: transparent;
}

.downloadBtn img,
.randomButton img {
  height: 40px;
  width: auto;
}

</style>

// ===== CONSTANTS =====
const topMatter = `<?xml version="1.0" encoding="UTF-8"?>
<cockatrice_deck version="1">
    <deckname></deckname>
    <comments></comments>
    <zone name="main">`;

const bottomMatter = `    </zone>
</cockatrice_deck>`;

// ===== STATE =====
let selected = [];

// ===== INIT =====
const grid = document.getElementById("grid");

packs.forEach((pack, index) => {
  const div = document.createElement("div");
  div.className = "pack";
  div.dataset.index = index;

  div.innerHTML = `<img src="${pack.image}">`;

  div.onclick = () => selectPack(index, div);
  div.onmouseenter = () => hover(div, true);
  div.onmouseleave = () => hover(div, false);

  grid.appendChild(div);
});

// ===== SELECTION =====
function selectPack(index, el) {
  const img = el.querySelector("img");
  const existing = selected.find(p => p.index === index);

  if (existing) {
    selected = selected.filter(p => p.index !== index);
    img.style.borderColor = "transparent";
  } else {
    if (selected.length === 2) {
      selected[0].img.style.borderColor = "transparent";
      selected.shift();
    }

    img.style.borderColor = "red";
    selected.push({ index, img });
  }

  updateButton();
}

function hover(el, entering) {
  const img = el.querySelector("img");

  if (img.style.borderColor !== "red") {
    img.style.borderColor = entering ? "pink" : "transparent";
  }
}

// ===== DOWNLOAD BUTTON =====
function updateButton() {
  const btn = document.getElementById("downloadBtn");

  if (selected.length === 2) {
    btn.disabled = false;
    btn.classList.add("enabled");
  } else {
    btn.disabled = true;
    btn.classList.remove("enabled");
  }
}

// ===== DOWNLOAD =====
function downloadDecklist() {
  if (selected.length < 2) return;

  const [a, b] = selected;
  const deck1 = packs[a.index];
  const deck2 = packs[b.index];

  const text =
    topMatter + "\n" +
    deck1.cards + "\n" +
    deck2.cards + "\n" +
    bottomMatter;

  const filename = `${deck1.name}+${deck2.name}.cod`;

  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.download = filename;
  link.href = url;
  link.click();

  URL.revokeObjectURL(url);
}

// ===== RANDOM =====
function randomize() {
  document.querySelectorAll(".pack img").forEach(img => {
    img.style.borderColor = "transparent";
  });

  selected = [];

  let a = Math.floor(Math.random() * packs.length);
  let b;

  do {
    b = Math.floor(Math.random() * packs.length);
  } while (a === b);

  document.querySelector(`[data-index="${a}"]`).click();
  document.querySelector(`[data-index="${b}"]`).click();
}

// ===== NAV =====
function go(url) {
  window.location.href = url;
}
