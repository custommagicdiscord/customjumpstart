<!DOCTYPE html>
<html>
<head>
<title>Custom Magic Jumpstart Gallery</title>
<link rel="icon" type="image/x-icon" href="/CMfavicon.ico">
<meta charset="UTF-8">
<meta name="description" content="Card gallery for Custom Magic jumpstart packs.">
<style>

/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
}

/* ===== FONT ===== */
@font-face {
  font-family: "Bank Gothic";
  src: url('BankGothic Bold.ttf');
}

/* ===== BASE ===== */
body {
  font-family: "Bank Gothic";
  background-image: url('grey-blue-marble-texture 4.png');
  background-size: 100% 1000px;
  background-repeat: repeat-y;
}

/* ===== MAIN LAYOUT ===== */
.mainLayout {
  display: flex;
  width: 100%;
  align-items: flex-start;
}

/* ===== SIDEBAR ===== */
.leftCol {
  width: 180px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
  padding-left: 0;
  padding-top: 120px;
  position: sticky;
  top: 10px;
}

.tab {
  background-image: url('goldbarTrim.png');
  background-size: 100% 100%;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.tab span {
  color: #755301;
  font-size: 160%;
}

/* ===== HEADER ===== */
.headerContainer {
  background-image: url('goldbar.png');
  background-size: 100% 100%;
  width: 50%;
  height: 60px;
  margin: 20px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.headerText {
  color: #755301;
  font-size: 200%;
}

/* ===== RIGHT COLUMN ===== */
.rightCol {
  flex: 1;
  min-width: 0;
  padding-right: 10px;
}

/* ===== PACK SECTION ===== */
.packSection {
  margin-bottom: 16px;
}

.packHeaderLine {
  width: 50%;
  margin: 12px auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.packHeaderContainer {
  flex: 1;
  background-image: url('goldbar.png');
  background-size: 100% 100%;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.packHeaderContainer h2 {
  color: #755301;
  font-size: 180%;
  font-family: "Bank Gothic";
  font-weight: normal;
}

.expandBtn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  width: 40px;
  flex-shrink: 0;
}

.expandBtn img {
  width: 40px;
  height: 40px;
  object-fit: contain;
  display: block;
}

/* ===== CARD GRID ===== */
.cardGrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  width: 85%;
  margin: 0 auto;
}

.cardGrid.hidden {
  display: none;
}

.cardGrid img {
  width: 100%;
  aspect-ratio: 5 / 7;
  object-fit: contain;
  border: 1px solid transparent;
  border-radius: 4.5%;
  cursor: pointer;
  display: block;
}

.cardGrid img:hover {
  border-color: rgba(117, 83, 1, 0.4);
}

/* ===== LIGHTBOX ===== */
.lightboxOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.lightboxOverlay img {
  max-height: 80vh;
  max-width: 40vw;
  border-radius: 4%;
  object-fit: contain;
  cursor: default;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .leftCol {
    display: none;
  }

  .mobileTabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 8px auto;
    width: 95%;
  }

  .mobileTabs .tab {
    flex: 1;
    height: 40px;
    background-image: url('goldbar.png');
  }

  .mobileTabs .tab span {
    font-size: 120%;
  }

  .headerContainer {
    width: 95%;
    height: 50px;
  }

  .headerText {
    font-size: 150%;
  }

  .packHeaderLine {
    width: 85%;
  }

  .cardGrid {
    grid-template-columns: repeat(3, 1fr);
    width: 95%;
  }

  .lightboxOverlay img {
    max-width: 80vw;
  }
}

</style>
</head>
<body>

// ===== BUILD GALLERY =====
const container = document.getElementById('galleryContent');

packs.forEach((pack, packIndex) => {
  const ext = pack.ext || '.png';
  const isOpen = pack.defaultOpen === true;

  // Section wrapper
  const section = document.createElement('div');
  section.className = 'packSection';

  // Header row
  const headerLine = document.createElement('div');
  headerLine.className = 'packHeaderLine';

  const headerBox = document.createElement('div');
  headerBox.className = 'packHeaderContainer';
  const h2 = document.createElement('h2');
  h2.textContent = pack.name;
  headerBox.appendChild(h2);

  const expandBtn = document.createElement('button');
  expandBtn.className = 'expandBtn';
  const coinImg = document.createElement('img');
  coinImg.src = 'expandIconCoin.png';
  coinImg.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
  expandBtn.appendChild(coinImg);

  headerLine.appendChild(headerBox);
  headerLine.appendChild(expandBtn);
  section.appendChild(headerLine);

  // Card grid
  const grid = document.createElement('div');
  grid.className = 'cardGrid' + (isOpen ? '' : ' hidden');

  pack.cards.forEach(cardFile => {
    const filename = cardFile.endsWith('.png') || cardFile.endsWith('.jpg')
      ? cardFile
      : cardFile + ext;
    const src = `${pack.folder}/${filename}`;

    const img = document.createElement('img');
    img.dataset.src = src; // lazy load
    if (isOpen) img.src = src;
    img.alt = cardFile.replace(/\.(png|jpg)$/, '');
    img.onclick = () => openLightbox(src);

    grid.appendChild(img);
  });

  section.appendChild(grid);
  container.appendChild(section);

  // Toggle logic
  expandBtn.onclick = () => {
    const isHidden = grid.classList.toggle('hidden');
    coinImg.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';

    // Lazy-load images on first open
    if (!isHidden) {
      grid.querySelectorAll('img').forEach(img => {
        if (!img.src || img.src === window.location.href) {
          img.src = img.dataset.src;
        }
      });
    }
  };
});

// ===== LIGHTBOX =====
function openLightbox(src) {
  const overlay = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  overlay.style.display = 'flex';
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

// ===== NAV =====
function go(url) {
  window.location.href = url;
}

// ===== MOBILE TABS =====

  const tabs = [
    { label: 'ABOUT', url: 'Vault AboutPage.html' },
    { label: 'COMPILER', url: 'index.html' },
    { label: 'GALLERY', url: 'Vault Gallery.html' },
    { label: 'DOWNLOAD', url: 'Vault DownloadPage.html' }
  ];

  const mobileNav = document.createElement('div');
  mobileNav.className = 'mobileTabs';

  tabs.forEach(t => {
    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.innerHTML = `<span>${t.label}</span>`;
    tab.onclick = () => go(t.url);
    mobileNav.appendChild(tab);
  });

  const rightCol = document.querySelector('.rightCol');
  rightCol.insertBefore(mobileNav, document.getElementById('galleryContent'));
}
